# Bundle row for dsh-llm-retry-boost.
#
# This patch is a layer: it only inserts this plugin's own row. The tunable
# fields below are also editable from the Plugins page (they are the row's
# volatile config fields, projected by the Settings service), and a save from
# that page lands in your profile's cordis.patch.yml. Keep this list as the
# shipped defaults; edit the row here for deployment pins, or from the UI for
# day-to-day tuning. The whitelists are YAML-only: they decide which failures
# the plugin owns, so a change belongs next to the code that documents it.
# The shipped @deepseek-ai/dsh-llm-retry executor stays mounted: the plugin
# delegates non-transient failures to it.
- insert:
    - id: llm-retry-boost
      name: dsh-llm-retry-boost
      config:
        enabled: true
        retryableCodes:
          - EMPTY_RESPONSE
          - RATE_LIMIT
          - SERVER
          - TIMEOUT
          - TRANSPORT
        retryableHttpStatuses:
          - 408
          - 425
          - 429
          - 500
          - 502
          - 503
          - 504
        maxRetries: 0
        initialDelayMs: 1000
        maxDelayMs: 60000
        jitterRatio: 0.1
        respectRetryAfter: true
        configErrorBehavior: delegate
        logRetries: true
